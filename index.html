<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>Hello, world!</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; overflow: hidden; color: #f7f7ff; background: #0b1020; }
    body::before, body::after { content: ""; position: fixed; width: 44rem; height: 44rem; border-radius: 50%; filter: blur(100px); opacity: .28; pointer-events: none; }
    body::before { background: #7057ff; top: -24rem; left: -12rem; }
    body::after { background: #18d7c1; bottom: -29rem; right: -12rem; }
    main { position: relative; width: min(90vw, 760px); padding: clamp(2.5rem, 8vw, 6rem); text-align: center; border: 1px solid rgba(255,255,255,.14); border-radius: 32px; background: linear-gradient(145deg, rgba(255,255,255,.10), rgba(255,255,255,.035)); box-shadow: 0 32px 100px rgba(0,0,0,.42); backdrop-filter: blur(18px); animation: rise .8s cubic-bezier(.2,.8,.2,1) both; }
    .orb { width: 72px; height: 72px; display: grid; place-items: center; margin: 0 auto 2rem; border-radius: 24px; font-size: 2rem; background: linear-gradient(135deg, #9d8bff, #43e4d0); box-shadow: 0 10px 36px rgba(98,106,255,.4); }
    .eyebrow { margin: 0 0 1rem; color: #a8b5d4; font-size: .76rem; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(3.2rem, 10vw, 6.4rem); line-height: .98; letter-spacing: -.075em; background: linear-gradient(100deg, #fff 15%, #c5c0ff 55%, #7ef1df); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .intro { max-width: 36rem; margin: 1.5rem auto 2.5rem; color: #bac4dc; font-size: clamp(1rem, 2.5vw, 1.2rem); line-height: 1.7; }
    button { border: 0; border-radius: 999px; padding: .95rem 1.5rem; color: #0b1020; background: #f7f7ff; font: inherit; font-weight: 700; cursor: pointer; transition: transform .2s, box-shadow .2s, background .2s; box-shadow: 0 8px 28px rgba(255,255,255,.16); }
    button:hover { transform: translateY(-3px); box-shadow: 0 14px 34px rgba(126,241,223,.25); background: #dffcf7; }
    button:focus-visible { outline: 3px solid #7ef1df; outline-offset: 5px; }
    #message { min-height: 1.5em; margin: 1.2rem 0 0; color: #7ef1df; font-size: .92rem; }
    footer { position: fixed; bottom: 1.5rem; color: #8490ab; font-size: .78rem; letter-spacing: .08em; }
    @keyframes rise { from { opacity: 0; transform: translateY(20px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main>
    <div class="orb" aria-hidden="true">✦</div>
    <p class="eyebrow">A little something to get started</p>
    <h1>Hello,<br>world!</h1>
    <p class="intro">A fresh page, a blank canvas, and a whole world of possibilities. Your next great idea starts right here.</p>
    <button id="helloButton" type="button">Say hello <span aria-hidden="true">→</span></button>
    <p id="message" aria-live="polite"></p>
  </main>
  <footer>MADE FOR THE NEXT BIG THING</footer>
  <script>
    const button = document.querySelector('#helloButton');
    const message = document.querySelector('#message');
    button.addEventListener('click', () => {
      message.textContent = 'Hello right back at you ✨';
      button.innerHTML = 'Hello, friend! <span aria-hidden="true">✦</span>';
    });
  </script>
</body>
</html>
